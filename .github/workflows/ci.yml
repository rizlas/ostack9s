name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: black
        run: uv run black --check src tests
      - name: ruff
        run: uv run ruff check src tests
      - name: ty
        run: uv run ty check src
      - name: pytest
        run: uv run pytest -q

  binary:
    # Catches packaging regressions (missing data files, dynamic imports).
    strategy:
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: packaging/build-binary.sh dist
      - run: dist/ostack9s --help

  install-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh packaging/build-binary.sh
